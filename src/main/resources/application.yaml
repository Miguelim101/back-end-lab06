#======================================================================#
#== PASO 2: Hacemos la conexión entre el proyecto y la base de datos ==#
#======================================================================#

spring:
  # LAB 7: lee variables locales desde back-end-lab06/.env (excluido de Git). Ver .env.example
  config:
    import: optional:file:.env[.properties]

  # LAB 7: los usuarios viven en la tabla users. Se desactiva el usuario en memoria que Spring Boot
  # crea por defecto, porque además imprime una contraseña generada en los logs
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # Configuración de la conexión (Con las variables de entorno)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/todo_db}
    username: ${DB_USER:todo_user}
    password: ${DB_PASSWORD:todo_password}

  jpa:
    hibernate:
      # Configuración de JPA / Hibernate: Orientado a la base de datos (esta dirije)
      # Lo que significa que la base de datos se crea antes, luego se agregan datos con JPA (ORM)
      ddl-auto: validate
    # Mostrar el SQL en consola
    show-sql: true
    properties:
      hibernate:
        format_sql: true

#======================================================================#
#== LAB 7: Configuración del JWT                                     ==#
#======================================================================#
app:
  jwt:
    # Llave HMAC (Base64, mínimo 32 bytes). SIN valor por defecto: si falta JWT_SECRET la app no arranca
    secret: ${JWT_SECRET}
    # Emisor (claim iss) que se escribe al firmar y se exige al validar
    issuer: todo-api
    # Duración del token definida por el laboratorio (regla 2.1.6)
    expiration-minutes: 30
